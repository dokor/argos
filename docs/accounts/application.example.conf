# Merge into the mounted backend configuration; never commit filled credentials.
# Enable only after SMTP, provider callbacks and reverse-proxy routing are verified.
# Operator migration prerequisites: docs/accounts/legacy-admin-transition.md.
# Keep admin-api.token / ADMIN_API_TOKEN separate from account.jwt-secret:
# consented server analytics still uses it after legacy browser auth is retired.
account {
  enabled = false
  enabled = ${?ARGOS_ACCOUNTS_ENABLED}
  origin = "http://localhost:3000"
  origin = ${?ACCOUNT_ORIGIN}
  jwt-secret = ${?ACCOUNT_JWT_SECRET}
  jwt-ttl = 15m
  session-ttl = 24h
  idle-ttl = 24h
  recent-ttl = 5m
  claim-ttl = 24h
  oauth-ttl = 10m
  token-verify-ttl = 24h
  token-reset-ttl = 30m
  token-reauth-ttl = 30m
  argon.memory-kib = 19456
  argon.iterations = 2
  argon.parallelism = 1
  smtp {
    host = ${?ACCOUNT_SMTP_HOST}
    port = "587"
    username = ${?ACCOUNT_SMTP_USER}
    password = ${?ACCOUNT_SMTP_PASSWORD}
    from = ${?ACCOUNT_SMTP_FROM}
    require-tls = "true"
  }
  oauth {
    google {
      client-id = ${?ACCOUNT_GOOGLE_CLIENT_ID}
      client-secret = ${?ACCOUNT_GOOGLE_CLIENT_SECRET}
    }
    github {
      client-id = ${?ACCOUNT_GITHUB_CLIENT_ID}
      client-secret = ${?ACCOUNT_GITHUB_CLIENT_SECRET}
    }
    linkedin {
      client-id = ${?ACCOUNT_LINKEDIN_CLIENT_ID}
      client-secret = ${?ACCOUNT_LINKEDIN_CLIENT_SECRET}
    }
  }
}
