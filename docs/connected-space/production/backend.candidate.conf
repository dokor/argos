# Candidate only: do not replace the active /srv/configs/api-backend/prod.conf.
include classpath("application.conf")
include required(file("/config/clarte-private.conf"))

account {
  enabled = true
  origin = "https://argos.lelouet.fr"
  jwt-ttl = 15m
  session-ttl = 12h
  idle-ttl = 30m
  recent-ttl = 5m
  claim-ttl = 24h
  oauth-ttl = 10m
  token-verify-ttl = 24h
  token-reset-ttl = 30m
  token-reauth-ttl = 30m
  argon { memory-kib = 19456, iterations = 2, parallelism = 1 }
  smtp { port = "587", require-tls = "true" }
}

# Operator decision, 2026-10-14. Change these two numbers, then reload via an
# explicitly scheduled API restart. No code build or ledger reset is required.
usage.timezone = "UTC"
usage.offers.FREE.monthly-limit = 10
usage.offers.PREMIUM.monthly-limit = 1000

# Internal Docker endpoint; confirm that the candidate API shares mariadb-public.
# Confirm the existing Argos database and user in the operator inventory before cutover.
# FIRST START WITH V27 ERASES ALL EXISTING ARGOS DATA IN THIS DATABASE.
db.hikari."dataSource.url" = "jdbc:mariadb://"${clarte.database-host}"/argos_db_prod"
db.hikari."dataSource.user" = "argos_user"

# Conservative existing defaults; target hardware capacity still needs validation.
discovery {
  max-urls = 50
  max-depth = 3
  duration-seconds = 60
  requests-per-host = 2
  workers = 4
  queue-limit = 100
}
# Keep analytics opt-in and scanner/egress protections from the production Compose.
product-analytics.enabled = false
