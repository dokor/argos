 function save(){window.openai?.setWidgetState?.({modelContent:{direction:'Clarté',page:state.page,module:state.tab},privateContent:{page:state.page,tab:state.tab,accountTab:state.accountTab}}).catch(()=>{});}

 function categories(values=[68,54,92,74]){return `<div class="a-categories">${['Performance','Sécurité','SEO','Accessibilité'].map((label,i)=>`<div><div class="a-category-label"><span>${label}</span><span class="a-number">${values[i]}</span></div><div class="a-meter" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${values[i]}"><span style="width:${values[i]}%"></span></div></div>`).join('')}</div>`;}
 function historyTable(items=runs,short=false){return `<table class="a-table"><thead><tr><th>Page analysée</th><th class="a-hide-small">État</th><th>Score</th><th><span class="a-muted">Rapport</span></th></tr></thead><tbody>${items.map(r=>`<tr><td><button type="button" class="a-textbutton a-row-link cursor-interaction" data-site="${r.site}">${sites[r.site].host}${r.path==='/'?'':r.path}</button><p>${r.when}</p>${r.status==='failed'?'<p class="a-error">Échec de l’analyse</p>':''}</td><td class="a-hide-small">${badge(r.status==='failed'?'Échec':'Terminé',r.status==='failed'?'danger':'good')}</td><td class="a-number">${r.score===null?'—':r.score+'<span class="a-muted">/100</span>'}</td><td>${r.status==='failed'?link('Réessayer',`data-retry="${runs.indexOf(r)}"`):link('Ouvrir '+icon('arrow-up-right'),`data-report="${runs.indexOf(r)}"`)}</td></tr>`).join('')}</tbody></table>`;}
 function emptyBlock(title,text,action){return `<section class="a-panel a-empty"><div class="a-icon-square">${icon('scan-search')}</div><h2>${title}</h2><p>${text}</p>${action}</section>`;}
 function dashboard(){const top=heading('Vue d’ensemble','Retrouvez vos résultats et décidez de la prochaine action.',button(icon('plus')+' Analyser un site','data-go="analysis" data-tab="new"',true));if(state.empty)return top+emptyBlock('Bienvenue dans votre espace','Commencez par une URL. Votre rapport et vos prochaines analyses se retrouveront ici.',button('Lancer ma première analyse','data-go="analysis" data-tab="new"',true))+comingLinks();return top+`<div class="a-stats"><div class="a-stat"><span>Sites analysés</span><strong class="a-number">3</strong><small>6 URL dans votre espace</small></div><div class="a-stat"><span>Analyses ce mois</span><strong class="a-number">9</strong><small>8 terminées · 1 échec</small></div><div class="a-stat"><span>Constats critiques</span><strong class="a-number">2</strong><small>Derniers rapports de vos URL</small></div></div><div class="a-grid"><section class="a-panel"><div class="a-panel-head"><div><h2>Votre dernier diagnostic</h2><p>atelier-nova.fr · Page d’accueil</p></div>${icon('file-chart-column')}</div><div class="a-report-head"><strong class="a-big-score a-number">72<small>/100</small></strong><span class="a-trend">+8 points<small>Depuis l’analyse précédente</small></span></div>${categories()}<div class="a-actions">${link('Reprendre le rapport '+icon('arrow-right'),'data-report="0"')}</div></section><section class="a-panel"><div class="a-panel-head"><div><h2>À traiter en priorité</h2><p>2 constats · atelier-nova.fr</p></div></div><div class="a-issue"><div><h3>Renforcer les en-têtes de sécurité</h3><p>Page d’accueil · Sécurité</p></div>${badge('Critique','danger')}</div><div class="a-issue"><div><h3>Rendre le formulaire accessible</h3><p>/contact · Accessibilité</p></div>${badge('Critique','danger')}</div><div class="a-actions">${link('Voir les pages concernées '+icon('arrow-right'),'data-site="0"')}</div></section></div><section class="a-panel"><div class="a-panel-head"><div><h2>Analyses récentes</h2><p>Les trois dernières tentatives</p></div>${link('Tout l’historique','data-go="analysis" data-tab="history"')}</div>${historyTable(runs.slice(0,3),true)}</section>`+comingLinks();}
 function comingLinks(){return `<div class="a-next"><div class="a-icon-square">${icon('network')}</div><div><h3>Et demain, tout votre domaine.</h3><p>Audits multi-pages et automatisation · Bientôt</p></div>${link('Découvrir les modules '+icon('arrow-right'),'data-go="domain"')}</div>`;}
 function analysisTabs(){return `<div class="a-tabs" role="tablist" aria-label="Analyse d’un site">${[['new','Nouvelle analyse'],['sites','Mes sites'],['history','Historique']].map(([key,label])=>`<button type="button" class="cursor-interaction" role="tab" id="analysis-tab-${key}" aria-selected="${state.tab===key}" aria-controls="analysis-panel" data-analysis-tab="${key}">${label}</button>`).join('')}</div>`;}
 function analysis(){let content='';if(state.tab==='new')content=newAnalysis();if(state.tab==='sites')content=mySites();if(state.tab==='history')content=history();return heading('Analyse d’un site','Analysez une URL, retrouvez vos sites et suivez leurs résultats.')+analysisTabs()+`<div id="analysis-panel" role="tabpanel" aria-labelledby="analysis-tab-${state.tab}">${content}</div>`;}
 function newAnalysis(){return `<div class="a-grid form-layout"><section class="a-panel"><div class="a-panel-head"><div><h2>Quelle page souhaitez-vous analyser ?</h2><p>Une URL précise, un diagnostic complet.</p></div></div><form class="a-form" data-form="analyse"><div class="a-field"><label for="audit-url">URL de la page</label><input id="audit-url" name="url" inputmode="url" autocomplete="url" placeholder="https://votre-site.fr/" value="${esc(state.url)}" aria-describedby="audit-scope audit-error" required><p class="a-hint" id="audit-scope">L’analyse porte sur cette page. Les autres pages du domaine ne sont pas explorées.</p><p class="a-error" id="audit-error" role="alert">${esc(state.error)}</p></div><label class="a-check"><input type="checkbox" name="follow" checked><span>Conserver cette URL dans « Mes sites » pour retrouver ses analyses.</span></label><button type="submit" class="a-button a-primary cursor-interaction">${icon('scan-search')} Lancer l’analyse</button><p class="a-hint">Le rapport sera accessible dans votre espace personnel.</p></form></section><aside class="a-panel"><h2>Ce que vous allez découvrir</h2>${[['gauge','Performance','Chargement et poids de la page.'],['shield-check','Sécurité','HTTPS et protections HTTP.'],['search','SEO','Structure et indexabilité.'],['accessibility','Accessibilité','Points de friction pour vos visiteurs.']].map(([ico,title,text])=>`<div class="a-measure">${icon(ico)}<div><strong>${title}</strong><p>${text}</p></div></div>`).join('')}</aside></div>${state.empty?'':`<section class="a-panel"><div class="a-panel-head"><div><h2>Repartir d’un site connu</h2><p>Relancez une analyse après vos modifications.</p></div>${link('Mes sites','data-analysis-tab="sites"')}</div>${sites.slice(0,2).map((s,i)=>`<div class="a-suggestion"><div><h3>${s.host}</h3><p>Page d’accueil · Dernier score ${s.score}/100</p></div>${link('Utiliser cette URL '+icon('arrow-up-right'),`data-use="${i}"`)}</div>`).join('')}</section>`}`;}
 function mySites(){if(state.empty)return emptyBlock('Vos sites apparaîtront ici','Une fois votre première analyse lancée, vous retrouverez ici le site et ses URL.',button('Analyser une URL','data-analysis-tab="new"',true));return `<section class="a-panel"><div class="a-panel-head"><div><h2>Vos sites</h2><p>Les URL sont regroupées par domaine pour faciliter le suivi.</p></div>${link('Ajouter une URL','data-analysis-tab="new"')}</div>${sites.map((s,i)=>`<div class="a-soft-row"><div><h3 class="a-url">${s.host}</h3><p>${s.urls.length} URL suivies · Dernier rapport disponible : ${s.score}/100</p></div>${button('Voir les URL '+icon('arrow-right'),`data-site="${i}"`)}</div>`).join('')}</section><p class="a-hint">Chaque URL conserve son propre score et son historique. Le score affiché ci-dessus est celui du dernier rapport disponible.</p>`;}
 function filteredRuns(){return runs.filter(r=>(state.filter==='all'||r.status===state.filter)&&(sites[r.site].host+r.path).toLowerCase().includes(state.query.toLowerCase()));}
 function history(){if(state.empty)return emptyBlock('Aucune analyse pour le moment','Votre historique réunira les rapports terminés et les tentatives à relancer.',button('Lancer une analyse','data-analysis-tab="new"',true));return `<section class="a-panel"><div class="a-panel-head"><div><h2>Historique des analyses</h2><p>Résultats et tentatives, regroupés au même endroit.</p></div></div><div class="a-filter"><div class="a-field"><label for="history-query">Rechercher une URL</label><input id="history-query" type="search" placeholder="Domaine ou chemin…" value="${esc(state.query)}"></div><div class="a-field"><label for="history-status">État</label><select id="history-status"><option value="all" ${state.filter==='all'?'selected':''}>Tous les états</option><option value="complete" ${state.filter==='complete'?'selected':''}>Terminé</option><option value="failed" ${state.filter==='failed'?'selected':''}>Échec</option></select></div></div><div id="history-results" aria-live="polite">${historyResults()}</div></section>`;}
 function historyResults(){const found=filteredRuns();return found.length?historyTable(found):'<p class="a-hint">Aucune analyse ne correspond à ces critères.</p>';}
 function sitePage(){const s=sites[state.site];return link(icon('arrow-left')+' Mes sites','data-go="analysis" data-tab="sites"')+heading(esc(s.host),'Retrouvez les pages suivies et leurs derniers rapports.',button(icon('plus')+' Analyser une URL',`data-use="${state.site}"`,true))+`<section class="a-panel"><div class="a-panel-head"><div><h2>URL suivies</h2><p>Un diagnostic indépendant pour chaque page.</p></div>${badge(s.urls.length+' URL')}</div>${s.urls.map((path,i)=>`<div class="a-soft-row"><div><h3 class="a-url">${esc(s.host+path)}</h3><p>Dernier rapport disponible · ${s.score-i*3}/100</p></div>${link('Relancer '+icon('arrow-right'),`data-url="https://${s.host}${path}"`)}</div>`).join('')}</section><section class="a-panel"><div class="a-panel-head"><h2>Dernières analyses de ce site</h2></div>${historyTable(runs.filter(r=>r.site===state.site))}</section><div class="a-next"><div class="a-icon-square">${icon('network')}</div><div><h3>Analyser toutes les pages du domaine</h3><p>Un module dédié arrive prochainement.</p></div>${link('En savoir plus','data-go="domain"')}</div>`;}
 function domain(){return heading('Analyse d’un domaine entier','Une vision transversale de toutes les pages de votre site.',badge('Bientôt','soon'))+`<section class="a-future-hero"><div class="a-future-top"><span class="a-icon-square">${icon('network')}</span><span class="a-kicker" style="margin:0">Prochain module</span></div><h2>Du diagnostic d’une page à la vision d’ensemble.</h2><p>Explorez les pages de votre domaine, repérez les problèmes récurrents et identifiez les corrections qui auront le plus d’impact.</p><div class="a-future-strip"><span>Module en préparation · Aucune date annoncée</span>${button('Disponible prochainement','disabled')}</div></section><p class="a-kicker">Parcours envisagé</p><div class="a-steps"><article class="a-step"><span>01 / PÉRIMÈTRE</span><h3>Définir ce qui compte</h3><p>Domaine, sous-domaines, pages à inclure et chemins à exclure.</p></article><article class="a-step"><span>02 / EXPLORATION</span><h3>Découvrir les pages</h3><p>Constituer la liste des URL à partir des liens et du sitemap.</p></article><article class="a-step"><span>03 / SYNTHÈSE</span><h3>Prioriser à l’échelle du site</h3><p>Regrouper les problèmes communs et revenir au rapport de chaque page.</p></article></div><section class="a-panel"><div class="a-panel-head"><div><h2>Vous pouvez déjà commencer</h2><p>Analysez les pages clés une par une : accueil, contact ou page produit.</p></div></div>${button('Analyser une URL '+icon('arrow-right'),'data-go="analysis" data-tab="new"',true)}</section>`;}
 function integrations(){return heading('Intégrations','Faites entrer les audits dans votre manière de travailler.',badge('Bientôt','soon'))+`<section class="a-panel"><div class="a-panel-head"><div><h2>Un audit au bon moment, automatiquement.</h2><p>Modules en préparation · Les fonctionnalités ci-dessous sont envisagées.</p></div>${icon('workflow')}</div><p class="a-hint">Déclencher une analyse après un déploiement, récupérer les résultats ou être averti lorsqu’un rapport est prêt.</p></section>${[['braces','API','Pilotez vos analyses depuis vos propres outils.',['Lancer une analyse','Lire un rapport','Suivre un statut'],'Votre application déclenche une analyse, suit son avancement, puis récupère le rapport pour l’afficher dans votre outil.'],['git-pull-request','CI / CD','Vérifiez la qualité de votre site à chaque livraison.',['GitHub Actions','GitLab CI','Seuils de qualité'],'Après une mise en ligne sur un environnement de test, le pipeline lance un audit et vérifie les seuils que vous avez choisis.'],['webhook','Webhooks','Recevez les événements sans consulter l’interface.',['Rapport disponible','Analyse en échec'],'Votre outil reçoit un événement lorsqu’une analyse se termine ou rencontre un échec.']].map(([ico,title,text,tags,detail])=>`<article class="a-integration"><div class="a-integration-head"><span class="a-icon-square">${icon(ico)}</span><h2>${title}</h2>${badge('Bientôt','soon')}</div><p>${text}</p><div class="a-tags">${tags.map(tag=>`<span>${tag}</span>`).join('')}</div><details><summary class="cursor-interaction">Voir un usage envisagé</summary><p>${detail}</p></details></article>`).join('')}<p class="a-hint">Aucune clé API ni intégration ne peut être activée à ce stade.</p>`;}
 function account(){const tabs=[['profile','Profil'],['security','Sécurité'],['connections','Connexions']];let content='';if(state.accountTab==='profile')content=`<form class="a-form" data-form="profile"><h2>Informations personnelles</h2><div class="a-field"><label for="profile-name">Nom affiché</label><input id="profile-name" value="Camille Martin" required autocomplete="name"></div><div class="a-field"><label for="profile-email">Adresse e-mail</label><input id="profile-email" value="camille@example.com" disabled type="email"></div><p class="a-hint">${badge('Adresse vérifiée','good')}</p><button type="submit" class="a-button a-primary cursor-interaction">Enregistrer</button></form>`;if(state.accountTab==='security')content=`<section class="a-setting"><h2>Mot de passe</h2><p>Confirmez votre identité puis choisissez un nouveau mot de passe.</p>${button('Changer le mot de passe','data-action="password"')}</section><section class="a-setting"><h2>Sessions actives</h2><div class="a-connections"><div><h3>Votre session actuelle</h3><p>Connectée aujourd’hui</p></div>${badge('Cette session','good')}</div>${button('Déconnecter les autres sessions','data-action="sessions"')}</section><section class="a-setting"><h2>Supprimer mon compte</h2><p>Consultez les conséquences avant de confirmer la suppression.</p>${button('Supprimer mon compte','data-action="delete" style="color:var(--a-red)"')}</section>`;if(state.accountTab==='connections')content=`<h2>Comptes associés</h2><p class="a-hint">Connectez-vous à Argos avec vos comptes habituels.</p>${Object.entries(state.linked).map(([provider,linked])=>`<div class="a-connections"><div><h3>${provider}</h3><p>${linked?'Associé à votre compte':'Aucun compte associé'}</p></div>${button(linked?'Dissocier':'Associer',`data-provider="${provider}"`)}</div>`).join('')}`;return heading('Mon compte','Votre identité, vos accès et vos comptes associés.')+`<div class="a-tabs" role="tablist" aria-label="Réglages du compte">${tabs.map(([key,label])=>`<button type="button" class="cursor-interaction" role="tab" aria-selected="${state.accountTab===key}" aria-controls="account-panel" id="account-tab-${key}" data-account-tab="${key}">${label}</button>`).join('')}</div><div class="a-account-layout"><section class="a-panel" id="account-panel" role="tabpanel" aria-labelledby="account-tab-${state.accountTab}">${content}</section><aside class="a-panel a-account-summary"><div class="a-avatar">CM</div><h3>Camille Martin</h3><p class="a-url">camille@example.com</p><p style="margin-top:15px">Compte personnel</p></aside></div>`;}
 function progress(){return heading('Analyse en cours','Les résultats se préparent pour la page sélectionnée.')+`<section class="a-panel"><div class="a-panel-head"><div><h2 class="a-url">${esc(state.url)}</h2><p>Démonstration du parcours · Aucun site n’est contacté</p></div>${badge('En cours')}</div><div class="a-meter" role="progressbar" aria-label="Progression de l’analyse" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.progress*25}"><span style="width:${state.progress*25}%"></span></div><div class="a-progress-list">${['Lecture de la page','Mesures et vérifications','Synthèse des constats','Préparation du rapport'].map((label,i)=>`<div class="a-progress-step"><div>${icon(i<state.progress?'circle-check':i===state.progress?'circle-dot':'circle')}${label}</div><span class="a-muted a-small">${i<state.progress?'Terminé':i===state.progress?'En cours':'À venir'}</span></div>`).join('')}</div><p class="a-hint" role="status">Simulation : étape ${Math.min(4,state.progress+1)} sur 4.</p></section>`;}
 function report(){const r=runs[state.run]||runs[0],score=state.run===-1?72:r.score,url=state.run===-1?state.url:'https://'+sites[r.site].host+r.path,values=score===89?[90,82,98,86]:score===61?[48,54,79,63]:[68,54,92,74];return link(icon('arrow-left')+' Historique','data-go="analysis" data-tab="history"')+heading('Rapport d’analyse',esc(url),button('Relancer',`data-url="${esc(url)}"`))+`<section class="a-panel a-report-summary"><div><span class="a-kicker">Score global</span><div class="a-report-head" style="margin-bottom:0"><strong class="a-big-score a-number">${score}<small>/100</small></strong><div>${badge('Analyse terminée','good')}<p>Une page analysée · Rapport de démonstration</p></div></div></div></section><div class="a-report-categories">${['Performance','Sécurité','SEO','Accessibilité'].map((label,i)=>`<section class="a-panel"><h3>${label}</h3><strong class="a-number">${values[i]}<small class="a-muted" style="font-size:11px"> /100</small></strong><div class="a-meter" aria-hidden="true"><span style="width:${values[i]}%"></span></div></section>`).join('')}</div><section class="a-panel" id="report-actions"><div class="a-panel-head"><div><h2>Plan d’action</h2><p>Les premières corrections à examiner pour cette page.</p></div></div><details class="a-report-issue"><summary class="cursor-interaction">Renforcer les en-têtes de sécurité</summary>${badge('Sécurité','danger')}<p>Vérifiez la présence et la configuration des protections HTTP. Le rapport détaillé présentera les en-têtes observés et les recommandations correspondantes.</p></details><details class="a-report-issue"><summary class="cursor-interaction">Réduire le poids des images</summary>${badge('Performance')}<p>Identifiez les images les plus lourdes et adaptez leur format ainsi que leurs dimensions à leur taille d’affichage.</p></details></section><section class="a-panel"><h2>Suivre vos améliorations</h2><p class="a-hint">Après une correction, relancez l’analyse de la même URL pour retrouver les deux rapports dans l’historique.</p><div class="a-actions">${button('Analyser à nouveau',`data-url="${esc(url)}"`,true)}${link('Retour à mes sites','data-go="analysis" data-tab="sites"')}</div></section>`;}
 function footer(){return `<footer class="a-footer" aria-label="Pied de page"><div class="a-footer-top"><div class="a-footer-brand"><strong>argos</strong><span>Votre espace de suivi web</span></div><button type="button" class="cursor-interaction" data-footer="help">Aide et contact ${icon('arrow-up-right')}</button></div><div class="a-footer-bottom"><nav class="a-footer-links" aria-label="Informations légales"><button type="button" class="cursor-interaction" data-footer="privacy">Confidentialité</button><button type="button" class="cursor-interaction" data-footer="legal">Mentions légales</button><a class="cursor-interaction" href="https://argos.lelouet.fr/" target="_blank" rel="noopener noreferrer">Retour au site ${icon('arrow-up-right')}</a></nav><button type="button" class="cursor-interaction" data-footer="preferences">${icon('sliders-horizontal')} Préférences · Français</button></div><div class="a-copyright"><span>© 2026 Argos</span><span>Clarté · Maquette interactive</span></div></footer>`;}
 function render(){const active=['report','progress','site'].includes(state.page)?'analysis':state.page,title=nav.find(n=>n[0]===active)?.[1]||'Mon compte',content=({dashboard,analysis,domain,integrations,account,report,site:sitePage,progress,quota,admin})[state.page]();app.innerHTML=`<div class="a-shell"><aside class="a-side"><div class="a-side-brand"><div class="a-brand"><span class="a-mark" aria-hidden="true"></span>argos</div><p class="a-workspace-label">Espace personnel</p></div><nav class="a-nav" aria-label="Modules"><span class="a-nav-label">Votre espace</span>${nav.map(([key,label,ico,soon])=>`<button type="button" class="cursor-interaction" data-go="${key}" ${active===key?'aria-current="page"':''}>${icon(ico)}<span>${label}${soon?`<small>${soon}</small>`:''}</span></button>`).join('')}</nav><div class="a-side-bottom">${link(icon('circle-help')+' Aide et ressources','data-footer="help"')}<button type="button" class="a-account-button cursor-interaction" data-go="account" ${active==='account'?'aria-current="page"':''}><span class="a-avatar">CM</span><span><strong>Camille Martin</strong><small>Mon compte</small></span>${icon('chevron-right')}</button></div></aside><div class="a-work"><div class="a-top"><span>Mon espace <span aria-hidden="true">/</span> ${title}</span><div class="a-top-demo"><span>Données de démonstration · </span>${link('Mon compte','data-go="account"')}</div></div><main class="a-main">${state.message?`<div class="a-notice" role="status">${esc(state.message)}</div>`:''}${content}</main>${footer()}</div></div><div class="a-overlay" hidden><section class="a-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
 function openModal(title,body){lastFocus=document.activeElement;const overlay=app.querySelector('.a-overlay');overlay.hidden=false;const dialog=overlay.querySelector('.a-dialog');dialog.innerHTML=`<div class="a-dialog-head"><h2 id="dialog-title">${title}</h2><button type="button" class="a-close cursor-interaction" aria-label="Fermer" data-close>${icon('x')}</button></div>${body}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});dialog.querySelector('button,input,select')?.focus();}
 function closeModal(){app.querySelector('.a-overlay').hidden=true;if(lastFocus?.isConnected)lastFocus.focus();}
 function launch(form){const raw=new FormData(form).get('url').trim();let parsed;try{parsed=new URL(raw);if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname.includes('.'))throw Error();}catch{state.error='Saisissez une URL complète commençant par https:// ou http://.';app.querySelector('#audit-error').textContent=state.error;app.querySelector('#audit-url').setAttribute('aria-invalid','true');return;}state.url=parsed.href;state.reportTab='measures';state.progress=0;state.page='progress';state.empty=false;state.run=-1;render();const step=()=>{if(state.page!=='progress')return;state.progress++;if(state.progress>=4){state.page='report';state.message='Analyse simulée : les scores présentés sont des données de démonstration.';render();save();}else{render();timer=setTimeout(step,650);}};timer=setTimeout(step,650);}

 function compareView(r,f,demo){if(state.run!==0||demo)return `<section class="a-panel"><h2>Pas de comparaison disponible</h2><p class="a-hint">Il faut deux analyses de la même URL avec des conditions compatibles. Cet exemple ne possède pas de paire comparable.</p><div class="a-actions">${techOpen(0,'compare','Explorer une comparaison disponible')}</div></section>`;const incompatible=state.compareBase==='desktop';return `<section class="a-panel"><div class="a-panel-head"><div><h2>Ce qui a changé sur cette URL</h2><p>https://atelier-nova.fr/ · Comparaison de deux exécutions</p></div></div><div class="a-field"><label for="compare-base">Analyse de référence</label><select id="compare-base"><option value="previous" ${!incompatible?'selected':''}>10 oct., 10:42 · Mobile · A-1023</option><option value="desktop" ${incompatible?'selected':''}>09 oct., 14:00 · Bureau · A-1017</option></select></div><div class="t-compare"><div><span class="a-kicker">Référence</span><h3>${incompatible?'09 oct. · Bureau':'10 oct. · Mobile'}</h3><p>${incompatible?'desktop-v1':'mobile-v1'} · Score ${incompatible?'94':'76'}/100</p></div><div><span class="a-kicker">Analyse actuelle</span><h3>13 oct. · Mobile</h3><p>mobile-v1 · Score 72/100</p></div></div>${incompatible?`<div class="t-banner">${icon('info')}<div><h3>Profils différents : écarts non calculés</h3><p>Viewport, réseau et CPU diffèrent. Choisissez une référence mobile-v1 pour interpréter les variations.</p></div></div>`:`<div class="t-meta">${badge('Conditions compatibles','good')}<span>Même URL finale · Même profil · Mêmes moteurs · Score V7</span></div><div class="t-tablewrap" style="margin-top:24px"><table class="a-table"><thead><tr><th>Mesure</th><th>10 oct.</th><th>13 oct.</th><th>Écart</th></tr></thead><tbody>${[['Score global','76','72','−4 pts',false],['LCP','2,6 s','3,8 s','+1,2 s',false],['FCP','1,3 s','1,2 s','−0,1 s',true],['CLS','0,04','0,04','Stable',null],['TBT','230 ms','280 ms','+50 ms',false],['Poids','1,5 Mo','2,4 Mo','+0,9 Mo',false],['Requêtes','61','68','+7',null]].map(([label,a,b,delta,good])=>`<tr><td>${label}</td><td class="a-number">${a}</td><td class="a-number">${b}</td><td class="a-number ${good===true?'t-good':good===false?'t-bad':''}">${delta}</td></tr>`).join('')}</tbody></table></div><p class="a-hint">Un écart entre deux exécutions est un signal à vérifier ; répétez la mesure pour confirmer une régression.</p>`}</section>${incompatible?'':`<section class="a-panel"><h2>Évolution des constats</h2><div class="a-soft-row"><div><h3>Image principale trop lourde</h3><p>Performance · Apparue dans cette analyse</p></div>${badge('Nouveau','danger')}</div><div class="a-soft-row"><div><h3>Titre de page générique</h3><p>SEO · Non retrouvé dans l’analyse actuelle</p></div>${badge('Résolu','good')}</div><div class="a-soft-row"><div><h3>Politique CSP absente</h3><p>Sécurité · Toujours observée</p></div>${badge('Persistant')}</div>${link('Examiner les preuves actuelles','data-report-tab="findings"')}</section>`}`;}
 function executionView(r,f){const failed=r.status==='failed',partial=r.status==='partial';return `<section class="a-panel"><div class="a-panel-head"><div><h2>Exécution ${f.id}</h2><p>${f.date} · Durée : ${f.duration}</p></div>${statusBadge(r.status)}</div>${failed?`<div class="t-banner">${icon('circle-alert')}<div><h3>Le document HTML n’a pas répondu à temps</h3><p>Code : NAVIGATION_TIMEOUT · Étape HTTP · Délai : 30 s<br>Aucune mesure exploitable. Le précédent rapport reste disponible.</p></div></div><code class="t-code">GET https://studio-ligne.fr/\nRéponse HTTP : non reçue\nInterruption après 30 000 ms</code><h3>Avant de réessayer</h3><p class="a-hint">Vérifiez que la page répond depuis un réseau externe, puis contrôlez les journaux serveur et les éventuels blocages du pare-feu.</p><div class="a-actions">${button('Réessayer cette URL',`data-url="${esc(runUrl(r))}"`,true)}${techOpen(4,'measures','Dernier rapport complet')}</div>`:`${partial?`<div class="t-banner">${icon('triangle-alert')}<div><h3>Scan ZAP interrompu après 30 s</h3><p>Les résultats des sept autres modules sont conservés. La sécurité reste incomplète et le score global n’est pas calculé.</p></div></div>`:''}${[['HTTP','Réponse, redirections et en-têtes','1 s'],['HTML','Structure, métadonnées et balises','1 s'],['Runtime','Réseau et erreurs navigateur','4 s'],['Lighthouse','Performance, SEO et accessibilité','8 s'],['Observatory','Configuration des protections HTTP','2 s'],['SSL','Certificat et configuration TLS','1 s'],['ZAP','Vérifications de sécurité','3 s'],['Technologies','Technologies détectées','1 s']].map(([label,desc,duration])=>`<div class="t-status"><div><h3>${label}</h3><p>${desc}</p></div><div>${partial&&label==='ZAP'?badge('Délai dépassé · 30 s','partial'):badge('Terminé','good')}</div></div>`).join('')}${partial?`<div class="a-actions">${button('Relancer l’analyse complète',`data-url="${esc(runUrl(r))}"`,true)}${link('Consulter les mesures disponibles','data-report-tab="measures"')}</div>`:''}`}</section>`;}
 report=function(){const {r,f,demo}=current(),url=demo?state.url:runUrl(r),requested=!demo&&f.redirect?url.replace('https:','http:'):url,failed=r.status==='failed',partial=r.status==='partial';return link(icon('arrow-left')+' Historique','data-go="analysis" data-tab="history"')+heading('Diagnostic de la page',esc(url),button(icon('rotate-cw')+' Relancer',`data-url="${esc(url)}"`))+`<section class="a-panel"><div class="a-report-summary"><div><span class="a-kicker">${failed?'Diagnostic indisponible':partial?'Résultats partiels':'Score global de la page'}</span><div class="a-report-head" style="margin-bottom:0"><strong class="a-big-score">${r.score??'—'}${r.score!==null?'<small>/100</small>':''}</strong><div>${statusBadge(r.status)}<p>${failed?'Aucun module terminé':partial?'7/8 modules · Sécurité incomplète':'8/8 modules · Couverture complète'}</p></div></div></div><div class="a-muted a-small">${demo?'Exécution simulée':f.date}<br>${demo?'DEMO':f.id} · ${f.duration} · Mobile</div></div><dl class="t-context"><div><dt>URL demandée</dt><dd>${esc(requested)}</dd><dt>URL finale</dt><dd>${failed?'Non obtenue':esc(url)} ${!failed&&!demo&&f.redirect?badge('1 redirection · 301 → 200'):!failed?badge('HTTP 200','good'):''}</dd></div><div><dt>Périmètre</dt><dd>Cette page uniquement · Sans authentification</dd><dt>Conditions</dt><dd>Mobile · 390 × 844 px · Cache vierge<br>Profil mobile-v1 · Score V7</dd></div></dl><div id="technical-conditions">${conditions()}</div></section>${partial?`<div class="t-banner">${icon('triangle-alert')}<div><h3>La couverture est incomplète</h3><p>Les mesures disponibles sont consultables ; les vérifications ZAP manquent.</p>${link('Comprendre et relancer','data-report-tab="execution"')}</div></div>`:''}<div class="a-tabs" role="tablist" aria-label="Diagnostic technique">${reportTabs.map(([id,label])=>`<button type="button" class="cursor-interaction" role="tab" id="report-tab-${id}" aria-selected="${state.reportTab===id}" aria-controls="technical-panel" data-report-tab="${id}">${label}${id==='findings'?' · '+f.issues.length:''}</button>`).join('')}</div><div id="technical-panel" role="tabpanel" aria-labelledby="report-tab-${state.reportTab}">${state.reportTab==='measures'?measuresView(r,f):state.reportTab==='findings'?findingsView(r,f):state.reportTab==='compare'?compareView(r,f,demo):executionView(r,f)}</div>`;};
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.techReport!==undefined){state.run=Number(b.dataset.techReport);state.reportTab=b.dataset.reportView||'measures';state.compareBase='previous';go('report');}if(b.dataset.reportTab){state.reportTab=b.dataset.reportTab;render();save();app.querySelector('#report-tab-'+state.reportTab)?.focus();}if(b.hasAttribute('data-conditions')){const details=app.querySelector('#technical-conditions details');details.open=true;details.querySelector('summary').focus();}});
 app.addEventListener('change',e=>{if(e.target.id==='compare-base'){state.compareBase=e.target.value;render();app.querySelector('#compare-base').focus();}});
 app.addEventListener('keydown',e=>{const target=e.target.closest('[data-report-tab]');if(!target||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=reportTabs.findIndex(([key])=>key===state.reportTab);state.reportTab=reportTabs[e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4][0];render();app.querySelector('#report-tab-'+state.reportTab).focus();save();});

 const q={step:0,host:'atelier-nova.fr',limit:20,excluded:'/admin/',selected:new Set(['/','/contact','/collections']),result:[],inventory:'all',user:0,adminView:'list',ledger:[],reserved:0,done:false,discoveries:[],error:'',count:0};
 const available=()=>Math.max(0,users[0].limit-users[0].used-q.reserved);
 const inventory=[{host:'atelier-nova.fr',path:'/',status:'complete',priority:true,run:0},{host:'atelier-nova.fr',path:'/contact',status:'complete',priority:true,run:3},{host:'atelier-nova.fr',path:'/collections',status:'none',priority:false},{host:'maison-olive.fr',path:'/',status:'partial',priority:false,run:1},{host:'maison-olive.fr',path:'/boutique',status:'none',priority:false},{host:'studio-ligne.fr',path:'/',status:'failed',priority:false,run:2}];
 const qlink=(label,action)=>link(label,`data-q="${action}"`);
 function inventoryBlock(){const entries=inventory.filter(item=>q.inventory==='priority'?item.priority:q.inventory==='incomplete'?item.status!=='complete':true);return `<section class="a-panel"><div class="a-panel-head"><div><h2>État de vos URL</h2><p>6 URL enregistrées · 3 sites · Dernières tentatives uniquement</p></div>${link('Mes sites','data-go="analysis" data-tab="sites"')}</div><div class="q-pillrow">${[['all','Toutes · 6'],['priority','Prioritaires · 2'],['incomplete','À compléter · 4']].map(([id,label])=>button(label,`data-inventory="${id}" aria-pressed="${q.inventory===id}"`)).join('')}</div>${entries.map(item=>`<div class="a-soft-row"><div><h3 class="a-url">${item.host+item.path}</h3><div class="t-meta">${item.status==='none'?badge('Jamais analysée','soon'):statusBadge(item.status)}<span>${item.priority?'1 constat important':item.status==='none'?'Diagnostic à lancer':item.status==='partial'?'Sécurité incomplète':'Aucune mesure récente disponible'}</span></div></div>${item.run!==undefined?techOpen(item.run,item.priority?'findings':'execution',item.priority?'Examiner':'Comprendre'):link('Analyser',`data-url="https://${item.host}${item.path}"`)}</div>`).join('')}</section>`;}
 dashboard=function(){const header=heading('Vue d’ensemble','Ce qui demande votre attention, sur vos sites.',button(icon('plus')+' Nouvelle analyse','data-go="analysis" data-tab="new"',true));if(state.empty)return header+emptyBlock('Commencez par une page ou un domaine','Vos diagnostics, leur couverture et votre consommation seront réunis ici.',button('Analyser un domaine','data-go="domain"',true));return header+`<div class="q-kpis"><button type="button" class="q-kpi cursor-interaction" data-inventory="priority"><span>URL avec un problème prioritaire</span><strong>2</strong><small>Sur 6 URL · 2 constats importants</small><em>Voir les corrections →</em></button><button type="button" class="q-kpi cursor-interaction" data-inventory="incomplete"><span>URL sans diagnostic complet</span><strong>4<small> / 6</small></strong><small>2 non analysées · 1 partielle · 1 échec</small><em>Compléter la couverture →</em></button><button type="button" class="q-kpi cursor-interaction" data-go="quota"><span>Crédits disponibles</span><strong>${available()}<small> / ${users[0].limit}</small></strong><small>1 crédit par page · Renouvellement le 1 nov.</small><em>Consulter mes quotas →</em></button></div>${inventoryBlock()}<div class="a-grid"><section class="a-panel"><div class="a-panel-head"><h2>Dernier diagnostic</h2>${statusBadge('complete')}</div><h3>atelier-nova.fr/</h3><div class="a-report-head"><strong class="a-big-score">72<small>/100</small></strong><div><span class="t-bad">LCP : +1,2 s</span><p class="a-hint">Même URL et même profil</p></div></div>${techOpen(0,'compare','Examiner la variation')}</section><section class="a-panel"><div class="a-panel-head"><h2>Passer à l’échelle du domaine</h2>${icon('network')}</div><p class="a-hint">Découvrez les pages, ajustez le périmètre, puis analysez une sélection avec un budget maîtrisé.</p><div class="a-actions">${button('Analyser un domaine','data-go="domain"',true)}</div><p class="a-hint">La découverte des URL ne consomme pas de crédit.</p></section></div>`;};
 comingLinks=function(){return `<div class="a-next"><div class="a-icon-square">${icon('plug')}</div><div><h3>Automatiser vos audits</h3><p>API, CI/CD et webhooks · Bientôt</p></div>${link('Voir les intégrations','data-go="integrations"')}</div>`;};
 function domainStepper(){return `<ol class="q-stepper">${['Périmètre','Pages & budget','Résultats'].map((name,i)=>`<li ${q.step===i?'aria-current="step"':''}><span>${i+1}</span>${name}</li>`).join('')}</ol>`;}
 function domainSetup(){return `<div class="q-grid"><section class="a-panel"><h2>Définir le périmètre</h2><form data-form="domain-discover" class="a-form" style="margin-top:20px"><div class="a-field"><label for="domain-host">Domaine ou URL de départ</label><input id="domain-host" name="host" value="${esc(q.host)}" placeholder="exemple.fr" required><p class="a-hint">Exploration du même hôte uniquement. Les sous-domaines restent exclus.</p></div><div class="a-field"><label for="domain-limit">Nombre maximal d’URL à découvrir</label><input id="domain-limit" name="limit" type="number" min="1" max="50" value="${q.limit}" required><p class="a-hint">Limite de votre compte : 50 pages par analyse de domaine.</p></div><div class="a-field"><label for="domain-excluded">Chemins à exclure</label><input id="domain-excluded" name="excluded" value="${esc(q.excluded)}"><p class="a-hint">Préfixes séparés par des virgules, par exemple /admin/, /panier/.</p></div><p class="a-error" role="alert">${esc(q.error)}</p><button type="submit" class="a-button a-primary cursor-interaction">${icon('search')} Découvrir les pages</button></form></section><aside class="a-panel"><h2>Avant l’analyse</h2><div class="q-rule"><h3>Découverte gratuite</h3><p>Liens internes et sitemap, dans les limites du périmètre et de robots.txt.</p></div><div class="q-rule"><h3>Vous choisissez les pages</h3><p>Aucun audit ne démarre pendant la découverte. Vous validez la sélection et son coût.</p></div><div class="q-rule"><h3>Profil constant</h3><p>Mobile-v1 · Cache vierge · Pages publiques sans connexion.</p></div><div class="q-cost">${available()} <small>crédits disponibles</small></div>${link('Mes quotas','data-go="quota"')}</aside></div>`;}
 function budgetBox(){const count=q.selected.size,allowed=count>0&&count<=available();return `<h2>Budget de cette analyse</h2><div class="q-cost">${count} <small>crédit${count>1?'s':''} maximum</small></div><div class="q-summary"><span>Disponibles maintenant</span><strong>${available()}</strong></div><div class="q-summary"><span>Restants après réservation</span><strong>${Math.max(0,available()-count)}</strong></div><p class="a-hint">1 page = 1 crédit. Une page partiellement analysée consomme 1 crédit ; un échec sans résultat est remboursé.</p>${count>available()?'<p class="a-error" role="alert">Quota insuffisant. Réduisez la sélection ou demandez une augmentation.</p>':''}<div class="a-actions">${button('Lancer '+count+' analyse'+(count>1?'s':''),`data-q="launch-domain" ${allowed?'':'disabled'}`,true)}</div><p class="a-hint">Simulation : aucun site n’est contacté.</p>`;}
 function domainSelection(){return `<div class="q-grid"><section class="a-panel"><div class="a-panel-head"><div><h2>${esc(q.host)}</h2><p>${q.discoveries.length} URL découvertes · Exploration bornée à ${q.limit} URL</p></div>${qlink('Modifier','scope')}</div><p class="a-hint">Données de démonstration. La découverte ne garantit pas l’exhaustivité du site.</p>${q.discoveries.map((item,i)=>`<label class="q-checkrow"><input type="checkbox" data-domain-page="${i}" ${q.selected.has(item.path)?'checked':''} ${item.excluded?'disabled':''}><span>${esc(item.path)}<small>${item.excluded?'Exclue par votre périmètre':'Page publique · '+item.source}</small></span>${item.excluded?badge('Exclue','soon'):''}</label>`).join('')}<div class="a-actions">${qlink('Tout sélectionner','select-all')}${qlink('Tout désélectionner','select-none')}</div></section><aside class="a-panel" id="domain-budget" aria-live="polite">${budgetBox()}</aside></div>`;}
 function domainResults(){const results=q.result,complete=results.filter(r=>r.status==='complete').length,partial=results.filter(r=>r.status==='partial').length,failed=results.filter(r=>r.status==='failed').length;return `<section class="a-panel"><div class="a-panel-head"><div><h2>${esc(q.host)}</h2><p>Analyse de domaine · Profil mobile-v1 · Sélection validée par vous</p></div>${badge(q.done?'Terminée':'En cours',q.done?'good':'')}</div><div class="q-cost">${q.done?results.length:q.count}<small> / ${results.length} pages traitées</small></div><div class="a-meter" role="progressbar" aria-label="Pages traitées" aria-valuemin="0" aria-valuemax="${results.length}" aria-valuenow="${q.done?results.length:q.count}"><span style="width:${(q.done?1:q.count/Math.max(1,results.length))*100}%"></span></div><div class="t-summaryline">${q.done?`<span>${complete} complètes</span><span>${partial} partielles</span><span>${failed} échecs</span><span>${complete+partial} crédits consommés · ${failed} libérés</span>`:`<span>${q.reserved} crédits réservés</span><span>Vous pouvez consulter les autres pages de votre espace.</span>`}</div></section>${q.done?`<section class="a-panel"><h2>Résultats par page</h2><p class="a-hint">Aucun score global n’est calculé pour le domaine. Chaque page conserve son diagnostic et sa couverture.</p>${results.map((item,i)=>`<div class="a-soft-row"><div><h3 class="a-url">${esc(item.path)}</h3><div class="t-meta">${statusBadge(item.status)}<span>${item.status==='failed'?'Délai dépassé · 0 crédit':item.status==='partial'?'7/8 modules · 1 crédit':'8/8 modules · 1 crédit'}</span></div></div>${qlink('Voir le diagnostic',`domain-result-${i}`)}</div>`).join('')}</section><section class="a-panel"><h2>Constats communs</h2><p class="a-hint">Regroupés par règle, avec la liste des pages concernées.</p><div class="a-soft-row"><div><h3>Politique CSP absente</h3><p>${results.filter(r=>r.path==='/'||r.path==='/contact').map(r=>r.path).join(' · ')||'Aucun constat commun illustré dans cette sélection'}</p></div>${badge('À examiner')}</div><div class="a-actions">${button('Nouvelle analyse de domaine','data-q="scope"')}${link('Voir la consommation','data-go="quota"')}</div></section>`:''}`;}

 function quota(){const u=users[0];return heading('Offre & quotas','Votre capacité d’analyse et le détail de votre consommation.')+`<div class="q-callout">Hypothèse de maquette : forfait de 100 crédits par mois. Les volumes et règles commerciales restent à valider.</div><div class="q-grid"><section class="a-panel"><div class="a-panel-head"><div><h2>Mon quota mensuel</h2><p>Du 1 au 31 octobre 2026 · Renouvellement le 1 novembre, 00:00 CET</p></div>${badge('Compte actif','good')}</div><div class="q-cost">${available()} <small>crédits disponibles / ${u.limit}</small></div><div class="a-meter" role="meter" aria-label="Crédits consommés ou réservés" aria-valuemin="0" aria-valuemax="${u.limit}" aria-valuenow="${u.used+q.reserved}"><span style="width:${Math.min(100,(u.used+q.reserved)/u.limit*100)}%"></span></div><div class="q-summary"><span>Consommés</span><strong>${u.used}</strong></div><div class="q-summary"><span>Réservés aux analyses en cours</span><strong>${q.reserved}</strong></div><div class="q-summary"><span>Limite par analyse de domaine</span><strong>50 pages</strong></div><div class="q-summary"><span>Analyses de domaine simultanées</span><strong>1</strong></div><div class="a-actions">${button('Demander plus de crédits','data-q="request-quota"')}</div></section><aside class="a-panel"><h2>Comment sont comptés les crédits ?</h2>${[['Découverte des URL','Gratuite. Vous consultez et sélectionnez les pages avant de réserver des crédits.'],['Audit d’une page','1 crédit réservé au lancement, consommé dès qu’un résultat complet ou partiel est disponible.'],['Échec sans résultat','Le crédit réservé est libéré automatiquement.'],['Nouvelle exécution','Relancer une page est une nouvelle analyse et nécessite un crédit.'],['Renouvellement','Le compteur mensuel est réinitialisé. Les crédits non utilisés ne sont pas reportés.']].map(([t,d])=>`<div class="q-rule"><h3>${t}</h3><p>${d}</p></div>`).join('')}</aside></div><section class="a-panel"><h2>Journal de consommation</h2><div n</h2><div class="q-summary"><span>Consommés ce mois-ci</span><strong>${u.used}</strong></div><div class="q-summary"><span>Disponibles</span><strong>${Math.max(0,u.limit-u.used-(q.user===0?q.reserved:0))}</strong></div><div class="q-summary"><span>Prochain renouvellement</span><strong>1 novembre</strong></div><h3 style="margin-top:20px">État du compte</h3><p class="a-hint">La suspension bloque la connexion et les nouvelles analyses. Les rapports existants sont conservés.</p><div class="a-actions">${button(u.active?'Suspendre le compte':'Réactiver le compte',`data-q="account-status" ${q.user===0?'disabled':''}`)}</div>${q.user===0?'<p class="a-hint">Votre propre compte administrateur ne peut pas être suspendu ici.</p>':''}</aside></div><section class="a-panel"><h2>Journal administratif</h2><div id="admin-log"><p class="a-hint">${u.audit?esc(u.audit):'Aucune modification dans cette session.'}</p></div></section>`);}
 const previousSubmit=submit;
 submit=function(form){const kind=form.dataset.form;if(kind==='domain-discover'){const data=new FormData(form);let url;try{const raw=data.get('host').trim();url=new URL(raw.includes('://')?raw:'https://'+raw);if(!['http:','https:'].includes(url.protocol)||!url.hostname.includes('.'))throw Error();}catch{form.querySelector('[role="alert"]').textContent='Saisissez un domaine valide, par exemple exemple.fr.';return;}q.host=url.hostname;q.limit=Number(data.get('limit'));q.excluded=data.get('excluded').trim();const exclusions=q.excluded.split(',').map(x=>x.trim()).filter(Boolean);q.discoveries=['/','/contact','/collections','/mentions-legales','/blog','/admin/'].slice(0,q.limit).map((path,i)=>({path,source:i<3?'Sitemap':'Lien interne',excluded:exclusions.some(prefix=>path.startsWith(prefix))}));q.selected=new Set(q.discoveries.filter(x=>!x.excluded).slice(0,3).map(x=>x.path));q.step=1;render();save();return;}if(kind==='admin-quota'){const data=new FormData(form),value=Number(data.get('limit')),u=users[q.user];if(!Number.isInteger(value)||value<u.used+(q.user===0?q.reserved:0)){form.querySelector('[role="alert"]').textContent='Le plafond doit couvrir les crédits consommés et réservés.';return;}u.audit=`Quota modifié de ${u.limit} à ${value} crédits par Camille Martin. Motif : ${data.get('reason')}`;u.limit=value;state.message='Quota enregistré dans la maquette. Aucun compte réel n’a été modifié.';render();return;}previousSubmit(form);};

 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.inventory){q.inventory=b.dataset.inventory;render();app.querySelector('.q-pillrow')?.scrollIntoView({block:'nearest'});return;}if(b.dataset.adminUser!==undefined){q.user=Number(b.dataset.adminUser);q.adminView='detail';go('admin');return;}const action=b.dataset.q;if(!action)return;if(action==='scope'){if(q.reserved>0&&!q.done){openModal('Analyse en cours','<p>Attendez la fin de l’analyse en cours avant de définir un nouveau périmètre.</p>');return;}q.step=0;go('domain');}if(action==='select-all'||action==='select-none'){q.selected=new Set(action==='select-all'?q.discoveries.filter(x=>!x.excluded).map(x=>x.path):[]);render();}if(action==='launch-domain'){if(q.selected.size<1||q.selected.size>available())return;q.result=[...q.selected].map(path=>({path,status:path==='/blog'?'failed':path==='/collections'?'partial':'complete'}));q.reserved+=q.result.length;q.step=2;q.count=0;q.done=false;render();let domainTimer=setInterval(()=>{q.count++;if(q.count>=q.result.length){clearInterval(domainTimer);q.done=true;const cost=q.result.filter(r=>r.status!=='failed').length;users[0].used+=cost;q.reserved=Math.max(0,q.reserved-q.result.length);q.ledger.unshift({label:'Analyse de domaine · '+q.result.length+' pages',host:q.host,cost});completeDomainRun();save();}if(['domain','quota','dashboard'].includes(state.page))render();},650);}if(action.startsWith('domain-result-')){const item=q.result[Number(action.split('-').at(-1))];if(q.host==='atelier-nova.fr'&&['/','/contact'].includes(item.path)){state.run=item.path==='/'?0:3;state.reportTab='findings';go('report');}else openModal('Diagnostic · '+item.path,`<p class="a-url">https://${esc(q.host+item.path)}</p><div class="a-actions">${statusBadge(item.status)}</div><p style="margin-top:16px">${item.status==='failed'?'La navigation a dépassé le délai autorisé. Aucun résultat exploitable. Le crédit réservé a été libéré.':item.status==='partial'?'  function commonProblems(r){const groups=sharedRules(r),measured=r.pages.filter(p=>p.status!=='failed').length;return `<section class="a-panel"><div class="a-panel-head"><div><h2>Problèmes communs</h2><p>Les corrections qui concernent plusieurs pages · Tri par nombre de pages touchées</p></div>${badge(groups.length+' règles')}</div>${groups.length?groups.map(({key,rule,affected},i)=>`<details class="d-common" ${i===0?'open':''}><summary class="cursor-interaction"><div><h3>${rule.title}</h3><small>${rule.category} · ${rule.label}</small></div><span>${affected.length}/${measured} pages évaluées ${icon('chevron-down')}</span></summary><div class="a-meter" aria-hidden="true"><span style="width:${affected.length/measured*100}%"></span></div><p>${rule.scope} ${rule.fix}</p><h3 style="font-size:12px;margin-top:12px">Pages concernées</h3><div class="d-paths">${affected.map(({p,i})=>dl(esc(p.path),`data-d-page="${i}" data-d-focus="${key}"`)).join('')}</div>${dl('Voir uniquement ces pages '+icon('arrow-right'),`data-d-rule="${key}"`)}</details>`).join(''):'<p class="a-hint">Aucune règle en échec commune à plusieurs pages parmi les résultats disponibles.</p>'}</section>`;}
 function pageProblemLabels(p){const critical=issueCount(p,'critical'),important=issueCount(p,'important');return `${critical?badge(critical+' critique'+(critical>1?'s':''),'danger'):''} ${important?badge(important+' important'+(important>1?'s':''),'partial'):''}${!critical&&!important?'<span class="a-muted a-small">Aucun constat prioritaire observé</span>':''}`;}
 function domainSummary(){const r=selectedDomain(),ranked=rankedPages(r),complete=r.pages.filter(p=>p.status==='complete').length,missing=r.pages.filter(p=>p.status!=='complete');return `<div class="d-summary"><div><span>Pages prioritaires</span><strong>${ranked.length}</strong><small>Au moins un constat important ou critique</small></div><div><span>Problèmes communs</span><strong>${sharedRules(r).length}</strong><small>Règles touchant au moins 2 pages</small></div><div><span>Diagnostics complets</span><strong>${complete}/${r.pages.length}</strong><small>Dans le périmètre sélectionné</small></div></div>${commonProblems(r)}<section class="a-panel"><div class="a-panel-head"><div><h2>Pages les plus problématiques</h2><p>Critiques d’abord, puis nombre de constats importants, puis score croissant.</p></div>${dl('Toutes les pages','data-d-tab="pages"')}</div>${ranked.length?ranked.slice(0,3).map((p,i)=>`<div class="d-ranked"><span class="d-rank">${i+1}</span><div><h3>${esc(p.path)}</h3><div class="t-meta">${pageProblemLabels(p)}</div><p>${p.score===null?'Score indisponible':p.score+'/100'} · ${p.status==='partial'?'Diagnostic partiel : classement provisoire':'Diagnostic complet'}</p></div>${dl('Voir le diagnostic '+icon('arrow-right'),`data-d-page="${p.index}"`)}</div>`).join(''):'<p class="a-hint">Aucun problème prioritaire observé sur les pages évaluées.</p>'}</section>${missing.length?`<section class="a-panel"><div class="a-panel-head"><div><h2>Couverture à compléter</h2><p>Ces pages peuvent encore masquer des problèmes.</p></div>${dl('Voir les pages incomplètes','data-d-filter="incomplete"')}</div>${missing.map(p=>`<div class="a-soft-row"><div><h3>${esc(p.path)}</h3><p>${p.status==='failed'?'Navigation interrompue · Aucune mesure exploitable':'Module ZAP indisponible · Résultats des autres modules conservés'}</p></div>${dl('Diagnostiquer',`data-d-page="${r.pages.indexOf(p)}"`)}</div>`).join('')}</section>`:''}`;}
 function domainPages(){const r=selectedDomain(),filtered=r.pages.map((p,i)=>({...p,index:i})).filter(p=>d.filter==='all'?true:d.filter==='priority'?priorityPage(p):d.filter==='incomplete'?p.status!=='complete':p.keys.includes(d.filter));return `<section class="a-panel"><div class="a-panel-head"><div><h2>Diagnostics des pages</h2><p>Chaque page ouvre son rapport, ses preuves et ses corrections.</p></div></div><div class="q-pillrow">${[['all','Toutes'],['priority','Prioritaires'],['incomplete','Incomplètes']].map(([id,label])=>dn(label,`data-d-filter="${id}" aria-pressed="${d.filter===id}"`)).join('')}</div>${domainRules[d.filter]?`<div class="q-callout">Filtre : ${domainRules[d.filter].title} · ${filtered.length} pages ${dl('Effacer','data-d-filter="all"')}</div>`:''}<div class="d-tablebox"><table class="d-table"><thead><tr><th>Page</th><th>Priorité</th><th>Score</th><th>Diagnostic</th></tr></thead><tbody>${filtered.map(p=>`<tr><td>${esc(p.path)}<p>${p.status==='complete'?'8/8 modules':p.status==='partial'?'7/8 modules · Partiel':'Échec · Aucune mesure'}</p></td><td>${p.status==='failed'?badge('À réessayer','danger'):pageProblemLabels(p)}</td><td class="a-number">${p.score??'—'}</td><td>${dl('Ouvrir',`data-d-page="${p.index}"`)}</td></tr>`).join('')}</tbody></table></div>${filtered.length?'':'<p class="a-hint">Aucune page dans cette sélection.</p>'}</section>`;}
 function domainPageReport(){const r=selectedDomain(),p=r.pages[d.page],failed=p.status==='failed',partial=p.status==='partial';const metricValues=p.path==='/collections'?['4,9 s','1,8 s','0,12','420 ms','3,2 Mo','94']:p.path==='/collections/automne'?['4,2 s','1,6 s','0,08','340 ms','2,8 Mo','81']:p.keys.includes('image')?['3,8 s','1,2 s','0,04','280 ms','2,4 Mo','68']:['1,8 s','0,8 s','0,02','90 ms','0,9 Mo','32'];return domainCrumb(true)+heading('Diagnostic de la page',esc('https://'+r.host+p.path),dn('Retour à la synthèse','data-d-action="back-summary"'))+`<section class="a-panel"><div class="a-report-summary"><div><span class="a-kicker">Score de cette page</span><div class="a-report-head"><strong class="a-big-score">${p.score??'—'}${p.score!==null?'<small>/100</small>':''}</strong>${statusBadge(p.status)}</div></div><div><p>${esc(r.date)}</p><p>${r.id} · Profil mobile-v1 · Page publique</p></div></div><div class="t-meta"><span>URL demandée : https://${esc(r.host+p.path)}</span><span>${failed?'Réponse non reçue':'URL finale identique · HTTP 200'}</span></div></section>${failed?`<section class="a-panel"><h2>Le chargement a dépassé le délai autorisé</h2><code class="t-code">GET https://${esc(r.host+p.path)}\nNAVIGATION_TIMEOUT · 30 000 ms\nAucune réponse exploitable</code><p class="a-hint">Vérifiez la disponibilité de la page depuis un réseau externe et les journaux du serveur. Aucun score ne peut être calculé.</p><div class="a-actions">${dn('Préparer une nouvelle analyse','data-d-action="retry-page"',true)}</div></section>`:`${partial?'<div class="t-banner"><div><h3>Diagnostic partiel</h3><p>ZAP a dépassé son délai. Les mesures ci-dessous et les constats HTTP, Lighthouse et Runtime restent disponibles. Aucun score global n’est calculé.</p></div></div>':''}<div class="t-sectionhead"><div><h2>Mesures observées</h2><p>Laboratoire · Mobile-v1 · Cache vierge · Données illustratives</p></div></div><div class="t-metrics">${metrics.map(([name,desc,source],i)=>`<section class="t-metric"><h3>${name}</h3><strong>${metricValues[i]}</strong><small>${desc} · ${source}</small></section>`).join('')}</div><section class="a-panel"><div class="a-panel-head"><div><h2>Constats et preuves</h2><p>${p.keys.length} règles en échec sur cette page</p></div></div>${p.keys.length?p.keys.map((key,i)=>{const rule=domainRules[key];return `<details class="a-report-issue" id="domain-issue-${key}" ${key===d.focus||!d.focus&&i===0?'open':''}><summary class="cursor-interaction"><span>${rule.title}<span class="t-meta">${rule.category} · ${rule.label}</span></span></summary><div class="t-proof"><div><h3>Preuve · ${rule.source}</h3><code class="t-code">${esc(rule.proof)}</code></div><div><h3>Correction proposée</h3><p>${rule.fix}</p><h3 style="margin-top:10px">Vérifier la correction</h3><p>Relancer cette URL avec le même profil et vérifier la disparition du constat.</p></div></div></details>`;}).join(''):'<p class="a-hint">Aucun constat illustré dans cette analyse. Les vérifications automatiques ne garantissent pas l’absence de tout problème.</p>'}</section>`}`;}
 const wizardProgress=domainResults;
 domain=function(){if(d.view==='list')return domainList();if(d.view==='page')return domainPageReport();if(d.view==='detail')return domainHeader()+`<div id="domain-content" role="tabpanel" aria-labelledby="domain-tab-${d.tab}">${d.tab==='summary'?domainSummary():domainPages()}</div>`;return dl(icon('arrow-left')+' Mes domaines','data-d-action="list"')+heading('Nouvelle analyse de domaine','Choisissez le périmètre et les pages à diagnostiquer.')+domainStepper()+(q.step===0?domainSetup():q.step===1?domainSelection():wizardProgress());};
 function completeDomainRun(){const template=initialDomains[0].pages;const record={host:q.host,date:'À l’instant · Analyse simulée',id:'D-DEMO-'+(d.records.length+1),discovered:q.discoveries.length,excluded:q.discoveries.filter(x=>x.excluded).length,pages:q.result.map(item=>{const ref=template.find(p=>p.path===item.path);return {path:item.path,status:item.status,score:item.status==='complete'?(ref?.score??91):null,keys:item.status==='failed'?[]:ref?.keys||[]};})};const index=d.records.findIndex(r=>r.host===q.host);if(index>=0)d.records[index]=record;else d.records.unshift(record);if(d.view==='wizard'){d.selected=Math.max(0,index);d.view='detail';d.tab='summary';d.filter='all';}}
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go==='domain')d.view='list';if(b.dataset.q==='scope')d.view='wizard';},true);
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let changed=false;if(b.dataset.dOpen!==undefined){d.selected=Number(b.dataset.dOpen);d.view='detail';d.tab='summary';d.filter='all';changed=true;}if(b.dataset.dPage!==undefined){d.page=Number(b.dataset.dPage);d.focus=b.dataset.dFocus||'';d.view='page';changed=true;}if(b.dataset.dTab){d.tab=b.dataset.dTab;d.view='detail';if(d.tab==='pages')d.filter='all';changed=true;}if(b.dataset.dRule){d.filter=b.dataset.dRule;d.tab='pages';d.view='detail';changed=true;}if(b.dataset.dFilter){d.filter=b.dataset.dFilter;d.tab='pages';d.view='detail';changed=true;}const action=b.dataset.dAction;if(action==='list'){d.view='list';changed=true;}if(action==='back-summary'){d.view='detail';d.tab='summary';changed=true;}if(action==='new'||action==='rerun'){if(q.reserved&&!q.done){openModal('Une analyse est en cours','<p>Attendez la fin de l’analyse en cours avant d’en lancer une nouvelle.</p>');return;}if(action==='rerun')q.host=selectedDomain().host;q.step=0;d.view='wizard';changed=true;}if(action==='progress'){d.view='wizard';changed=true;}if(action==='retry-page'){q.host=selectedDomain().host;q.step=0;d.view='wizard';changed=true;}if(changed){state.page='domain';state.message='';render();save();if(b.dataset.dTab)app.querySelector('#domain-tab-'+d.tab)?.focus();}});
 app.addEventListener('keydown',e=>{if(!e.target.matches('[data-d-tab]')||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();d.tab=d.tab==='summary'?'pages':'summary';render();app.querySelector('#domain-tab-'+d.tab)?.focus();save();});
 function restoreDomainWorkspace(saved){const w=saved?.domainWorkspace;if(!w)return;if(Array.isArray(w.records)&&w.records.length)d.records=w.records;if(Number.isInteger(w.selected)&&w.selected>=0&&w.selected<d.records.length)d.selected=w.selected;if(['list','detail','page','wizard'].includes(w.view))d.view=w.view;if(['summary','pages'].includes(w.tab))d.tab=w.tab;if(['all','priority','incomplete',...Object.keys(domainRules)].includes(w.filter))d.filter=w.filter;if(Number.isInteger(w.page)&&w.page>=0&&w.page<selectedDomain().pages.length)d.page=w.page;}
 restoreDomainWorkspace(restored);
 window.addEventListener('openai:set_globals',e=>{if(!q.reserved){restoreDomainWorkspace(e.detail?.globals?.widgetState?.privateContent);render();}});
 state.page=restored.domainWorkspace&&pages.includes(restored.page)?restored.page:'domain';
 const technicalNewAnalysis=newAnalysis;
 newAnalysis=function(){return technicalNewAnalysis().replace(/Page d’accueil · Dernier score \d+\/100/g,'Page d’accueil · URL enregistrée');};
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(!saved)return;if(Number.isInteger(saved.run)&&saved.run>=0&&saved.run<runs.length)state.run=saved.run;if(Number.isInteger(saved.site)&&saved.site>=0&&saved.site<sites.length)state.site=saved.site;if(reportTabs.some(([key])=>key===saved.reportTab))state.reportTab=saved.reportTab;render();});
 render();
 if(globalThis.Tweak){const design={radius:9,empty:false};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--a-radius',design.radius+'px');if(state.empty!==design.empty){state.empty=design.empty;go('dashboard');}}});tweak.addSlider(design,'radius',{label:'Arrondi des blocs',min:0,max:18,step:1,unit:'px'});tweak.addToggle(design,'empty',{label:'Aperçu du premier accès'});}
 window.addEventListener('openai:set_globals',e=>{const content=e.detail?.globals?.widgetState?.privateContent;if(!content)return;if(pages.includes(content.page)&&content.page!=='progress')state.page=content.page;if(['new','sites','history'].includes(content.tab))state.tab=content.tab;if(['profile','security','connections'].includes(content.accountTab))state.accountTab=content.accountTab;render();});
})();
</script>
