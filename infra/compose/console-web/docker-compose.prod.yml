services:
  console-web:
    build:
      context: /srv/apps/console-web/src
      dockerfile: Dockerfile
      args:
        ARGOS_REVISION: ${ARGOS_REVISION:-unknown}
    image: console-web:local
    container_name: console-web
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - /srv/configs/console-web/.env.prod
    environment:
      - NODE_ENV=production
      - ACCOUNT_ORIGIN=https://argos.lelouet.fr
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.console-web.rule=Host(`argos.lelouet.fr`)
      - traefik.http.routers.console-web.entrypoints=websecure
      - traefik.http.routers.console-web.tls=true
      - traefik.http.services.console-web.loadbalancer.server.port=3000
      - traefik.http.routers.console-web.priority=10
      - traefik.http.routers.console-web-api.rule=Host(`argos.lelouet.fr`) && PathPrefix(`/api`)
      - traefik.http.routers.console-web-api.entrypoints=websecure
      - traefik.http.routers.console-web-api.tls=true
      - traefik.http.routers.console-web-api.service=console-web
      - traefik.http.routers.console-web-api.priority=200
      - traefik.http.routers.console-web-api.tls.options=modern@file

      # Account authentication: edge budget per TCP client, Java retains persistent quotas.
      - traefik.http.routers.argos-account-auth.rule=Host(`argos.lelouet.fr`) && PathPrefix(`/api/account/auth/`)
      - traefik.http.routers.argos-account-auth.entrypoints=websecure
      - traefik.http.routers.argos-account-auth.tls=true
      - traefik.http.routers.argos-account-auth.tls.certresolver=le
      - traefik.http.routers.argos-account-auth.tls.options=modern@file
      - traefik.http.routers.argos-account-auth.service=console-web
      - traefik.http.routers.argos-account-auth.priority=210
      - traefik.http.routers.argos-account-auth.middlewares=argos-account-auth-limit
      - traefik.http.middlewares.argos-account-auth-limit.ratelimit.average=60
      - traefik.http.middlewares.argos-account-auth-limit.ratelimit.period=15m
      - traefik.http.middlewares.argos-account-auth-limit.ratelimit.burst=10
      - traefik.http.middlewares.argos-account-auth-limit.ratelimit.sourcecriterion.ipstrategy.depth=0

      # Public writes: TCP peer only; never accept a browser-supplied forwarded IP.
      - traefik.http.routers.argos-audit-write.rule=Host(`argos.lelouet.fr`) && Method(`POST`) && (Path(`/api/audits`) || Path(`/api/audits/`))
      - traefik.http.routers.argos-audit-write.entrypoints=websecure
      - traefik.http.routers.argos-audit-write.tls=true
      - traefik.http.routers.argos-audit-write.tls.certresolver=le
      - traefik.http.routers.argos-audit-write.tls.options=modern@file
      - traefik.http.routers.argos-audit-write.service=console-web
      - traefik.http.routers.argos-audit-write.priority=210
      - traefik.http.routers.argos-audit-write.middlewares=argos-audit-limit
      - traefik.http.middlewares.argos-audit-limit.ratelimit.average=5
      - traefik.http.middlewares.argos-audit-limit.ratelimit.period=15m
      - traefik.http.middlewares.argos-audit-limit.ratelimit.burst=2
      - traefik.http.middlewares.argos-audit-limit.ratelimit.sourcecriterion.ipstrategy.depth=0
      - traefik.http.routers.argos-newsletter-write.rule=Host(`argos.lelouet.fr`) && Method(`POST`) && (Path(`/api/newsletter`) || Path(`/api/newsletter/`) || Path(`/api/newsletter/subscribe`) || Path(`/api/newsletter/subscribe/`))
      - traefik.http.routers.argos-newsletter-write.entrypoints=websecure
      - traefik.http.routers.argos-newsletter-write.tls=true
      - traefik.http.routers.argos-newsletter-write.tls.certresolver=le
      - traefik.http.routers.argos-newsletter-write.tls.options=modern@file
      - traefik.http.routers.argos-newsletter-write.service=console-web
      - traefik.http.routers.argos-newsletter-write.priority=210
      - traefik.http.routers.argos-newsletter-write.middlewares=argos-newsletter-limit
      - traefik.http.middlewares.argos-newsletter-limit.ratelimit.average=20
      - traefik.http.middlewares.argos-newsletter-limit.ratelimit.period=15m
      - traefik.http.middlewares.argos-newsletter-limit.ratelimit.burst=5
      - traefik.http.middlewares.argos-newsletter-limit.ratelimit.sourcecriterion.ipstrategy.depth=0
      - traefik.http.routers.argos-premium-write.rule=Host(`argos.lelouet.fr`) && Method(`POST`) && (Path(`/api/premium-waitlist`) || Path(`/api/premium-waitlist/`))
      - traefik.http.routers.argos-premium-write.entrypoints=websecure
      - traefik.http.routers.argos-premium-write.tls=true
      - traefik.http.routers.argos-premium-write.tls.certresolver=le
      - traefik.http.routers.argos-premium-write.tls.options=modern@file
      - traefik.http.routers.argos-premium-write.service=console-web
      - traefik.http.routers.argos-premium-write.priority=210
      - traefik.http.routers.argos-premium-write.middlewares=argos-premium-limit
      - traefik.http.middlewares.argos-premium-limit.ratelimit.average=20
      - traefik.http.middlewares.argos-premium-limit.ratelimit.period=15m
      - traefik.http.middlewares.argos-premium-limit.ratelimit.burst=5
      - traefik.http.middlewares.argos-premium-limit.ratelimit.sourcecriterion.ipstrategy.depth=0
      - traefik.http.routers.argos-feedback-write.rule=Host(`argos.lelouet.fr`) && Method(`POST`) && (Path(`/api/feedback`) || Path(`/api/feedback/`))
      - traefik.http.routers.argos-feedback-write.entrypoints=websecure
      - traefik.http.routers.argos-feedback-write.tls=true
      - traefik.http.routers.argos-feedback-write.tls.certresolver=le
      - traefik.http.routers.argos-feedback-write.tls.options=modern@file
      - traefik.http.routers.argos-feedback-write.service=console-web
      - traefik.http.routers.argos-feedback-write.priority=210
      - traefik.http.routers.argos-feedback-write.middlewares=argos-feedback-limit
      - traefik.http.middlewares.argos-feedback-limit.ratelimit.average=5
      - traefik.http.middlewares.argos-feedback-limit.ratelimit.period=15m
      - traefik.http.middlewares.argos-feedback-limit.ratelimit.burst=3
      - traefik.http.middlewares.argos-feedback-limit.ratelimit.sourcecriterion.ipstrategy.depth=0

      - traefik.http.routers.console-web.tls.certresolver=le
      - traefik.http.routers.console-web.tls.options=modern@file

      - traefik.http.routers.console-web-http.rule=Host(`argos.lelouet.fr`)
      - traefik.http.routers.console-web-http.entrypoints=web
      - traefik.http.routers.console-web-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true

networks:
  proxy:
    external: true
