services:
  api-backend:
    build:
      context: /srv/apps/api-backend/src
      dockerfile: Dockerfile
      args:
        ARGOS_REVISION: ${ARGOS_REVISION:-unknown}
    image: api-backend:local
    container_name: api-backend
    restart: unless-stopped
    volumes:
      - /srv/configs/api-backend/prod.conf:/config/prod.conf:ro
    networks:
      - proxy
      - mariadb-public
      - argos_internal
      - argos_ai
      - argos_zap
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - NODE_ENV=production
      - JAVA_TOOL_OPTIONS=-Dconfig.file=/config/prod.conf
      - PLAYWRIGHT_SERVICE_URL=http://playwright-service:3016
      - LIGHTHOUSE_SERVICE_URL=http://lighthouse-service:3017
      - ZAP_API_URL=http://zap:8080
      - CODEX_SUMMARY_ENABLED=${CODEX_SUMMARY_ENABLED:-true}
      - CODEX_SUMMARY_SERVICE_URL=http://codex-summary:3010
      - CODEX_SUMMARY_TIMEOUT_SECONDS=${CODEX_SUMMARY_TIMEOUT_SECONDS:-45}
    depends_on:
      zap:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api-backend.rule=Host(`argos.lelouet.fr`) && PathPrefix(`/api`)
      - traefik.http.routers.api-backend.entrypoints=websecure
      - traefik.http.routers.api-backend.tls=true
      - traefik.http.routers.api-backend.priority=100
      - traefik.http.services.api-backend.loadbalancer.server.port=8081

  # Offline passive scanner: only this backend can reach its API; no host ports or egress.
  # Both amd64 and arm64 manifests are available for this official version.
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    container_name: argos-zap
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms128m -Xmx512m
    command:
      - zap.sh
      - -daemon
      - -silent
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - pscans.maxBodySizeInBytes=5242880
      - -config
      - pscans.maxAlertsPerRule=100
    networks:
      - argos_zap
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/JSON/core/view/version/', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  codex-summary:
    build:
      context: /srv/apps/api-backend/src/codex-summary
      dockerfile: Dockerfile
      args:
        CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-ghcr.io/dokor/codex-runtime:0.156.1-r1}
    image: argos-codex-summary:local
    container_name: argos-codex-summary
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      - PORT=3010
      - CODEX_HOME=/home/node/.codex
      - CODEX_MAX_CONCURRENCY=${CODEX_MAX_CONCURRENCY:-1}
      - CODEX_TIMEOUT_MS=${CODEX_TIMEOUT_MS:-90000}
      - CODEX_MAX_BODY_BYTES=${CODEX_MAX_BODY_BYTES:-262144}
    volumes:
      - argos_codex_home:/home/node/.codex
    expose:
      - "3010"
    networks:
      - argos_ai
      - argos_ai_egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  proxy:
    external: true
  mariadb-public:
    external: true
  argos_internal:
    external: true
  argos_ai:
    internal: true
  argos_zap:
    internal: true
  argos_ai_egress:

volumes:
  argos_codex_home:
