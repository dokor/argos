services:
  playwright-service:
    build:
      context: /srv/apps/playwright-service/src
      dockerfile: Dockerfile
    container_name: playwright-service
    restart: unless-stopped
    environment:
      - PORT=3016
      - NODE_ENV=production
      # optionnel : limites / timeouts
      - MAX_CONCURRENCY=2
      - NAV_TIMEOUT_MS=45000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3016/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - argos_internal

networks:
  argos_internal:
    external: true