name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-backend-tests:
    name: API backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api-backend/pom.xml

      - name: Run Maven tests and coverage report
        run: mvn --batch-mode verify
      - name: Upload Java coverage
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-${{ github.sha }}
          path: apps/api-backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console-web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/console-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test release evidence gate
        run: node --test ../../scripts/check-release-evidence.test.mjs
      - run: npm run test
      - run: npm run build
      - name: Verify test failure propagates
        run: node ../../scripts/verify-ci-failures.mjs frontend

  lighthouse:
    name: Lighthouse checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/lighthouse-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/lighthouse-service/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: Verify test failure propagates
        run: node ../../scripts/verify-ci-failures.mjs lighthouse

  playwright:
    name: Playwright checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/playwright-service
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/playwright-service/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: Verify test failure propagates
        run: node ../../scripts/verify-ci-failures.mjs playwright
