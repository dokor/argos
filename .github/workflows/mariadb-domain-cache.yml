name: MariaDB domain cache

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml

  domain-cache:
    name: MariaDB domain cache (${{ matrix.version }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ['10.11', '11.4']
    services:
      mariadb:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root-fixture
          MARIADB_DATABASE: argos_domain_cache_test
          MARIADB_USER: argos_fixture
          MARIADB_PASSWORD: synthetic-fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: apps/api-backend
    env:
      ARGOS_TEST_DOMAIN_CACHE_URL: jdbc:mariadb://127.0.0.1:3306/argos_domain_cache_test
      ARGOS_TEST_DOMAIN_CACHE_USER: argos_fixture
      ARGOS_TEST_DOMAIN_CACHE_PASSWORD: synthetic-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api-backend/pom.xml
      - run: mvn --batch-mode -P mariadb-integration -Dit.test=DomainAnalysisConcurrencyIT verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-domain-cache-${{ matrix.version }}-${{ github.sha }}
          path: apps/api-backend/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14
