name: Secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified gitleaks 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          expected=$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Verify negative synthetic probe and scan tracked snapshot
        run: |
          mkdir "$RUNNER_TEMP/secret-probe" "$RUNNER_TEMP/tracked"
          printf '%s="%s"\n' 'internal-api.auth-password' 'synthetic-leak-must-be-detected' > "$RUNNER_TEMP/secret-probe/application.conf"
          set +e
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/secret-probe" --config .gitleaks.toml --redact --no-banner --log-level error
          result=$?
          set -e
          test "$result" -eq 1
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tracked" --config .gitleaks.toml --redact --no-banner
      - name: Scan all new commits without exempting historical paths or rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range=HEAD
          if test -n "$BASE_SHA" && test "$BASE_SHA" != 0000000000000000000000000000000000000000; then range="$BASE_SHA..HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="$range" --redact --no-banner
