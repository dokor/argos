name: MariaDB progress

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml

  progress-10-11:
    name: MariaDB progress (10.11)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root-fixture
          MARIADB_DATABASE: argos_progress_test
          MARIADB_USER: argos_fixture
          MARIADB_PASSWORD: synthetic-fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: apps/api-backend
    env:
      ARGOS_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/argos_progress_test
      ARGOS_TEST_MARIADB_USER: argos_fixture
      ARGOS_TEST_MARIADB_PASSWORD: synthetic-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api-backend/pom.xml
      - run: mvn --batch-mode -P mariadb-integration -Dit.test=AuditRunProgressIT verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-progress-10.11-${{ github.sha }}
          path: apps/api-backend/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  progress-11-4:
    name: MariaDB progress (11.4)
    needs: [changes, progress-10-11]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root-fixture
          MARIADB_DATABASE: argos_progress_test
          MARIADB_USER: argos_fixture
          MARIADB_PASSWORD: synthetic-fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: apps/api-backend
    env:
      ARGOS_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/argos_progress_test
      ARGOS_TEST_MARIADB_USER: argos_fixture
      ARGOS_TEST_MARIADB_PASSWORD: synthetic-fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api-backend/pom.xml
      - run: mvn --batch-mode -P mariadb-integration -Dit.test=AuditRunProgressIT verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-progress-11.4-${{ github.sha }}
          path: apps/api-backend/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14
