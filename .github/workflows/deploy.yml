name: Deploy (Raspberry)

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to redeploy
        type: choice
        default: all
        options: [all, api-backend, console-web, playwright-service, lighthouse-service, infra-proxy]
      infra_revision:
        description: Merged raspberry-infra commit SHA (required for infra-proxy)
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'apps/api-backend/**'
      - 'apps/console-web/**'
      - 'apps/playwright-service/**'
      - 'apps/lighthouse-service/**'
      - 'apps/audit-egress/**'
      - 'infra/compose/api-backend/**'
      - 'infra/compose/console-web/**'
      - 'infra/compose/playwright-service/**'
      - 'infra/compose/lighthouse-service/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/ci/deploy-paths.mjs'

permissions:
  contents: read

# Keep the deployment and its final observation together across all services.
concurrency:
  group: deploy-production
  queue: max
  cancel-in-progress: false

jobs:
  infra-proxy:
    # raspberry-infra has no registered runner. Use the existing Raspberry runner
    # only for an explicit deployment of an immutable, merged infrastructure commit.
    if: github.repository == 'dokor/argos' && github.event_name == 'workflow_dispatch' && inputs.service == 'infra-proxy'
    runs-on: [self-hosted, raspberry, argos]
    timeout-minutes: 15
    env:
      INFRA_REVISION: ${{ inputs.infra_revision }}
      PROXY_DEPLOY_DIR: /srv/infra/raspberry-infra/proxy
      PROXY_ENV_FILE: /srv/infra/raspberry-infra/env/proxy.env
      TRAEFIK_ACME_FILE: /srv/infra/raspberry-infra/proxy/acme.json
      VERIFY_HOST: argos.lelouet.fr
    steps:
      - name: Require an immutable infrastructure revision
        run: '[[ "$INFRA_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          repository: dokor/raspberry-infra
          ref: ${{ inputs.infra_revision }}
          path: proxy-source
          persist-credentials: false
      - name: Verify the revision is merged in infrastructure main
        run: |
          test "$(git -C proxy-source rev-parse HEAD)" = "$INFRA_REVISION"
          git -C proxy-source fetch --no-tags origin main
          git -C proxy-source merge-base --is-ancestor "$INFRA_REVISION" FETCH_HEAD
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Preserve the live ACME account, certificates and proxy environment
        id: state
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { prepareProxyState } from './proxy-source/scripts/proxy-state.mjs';
          process.umask(0o077);
          try {
            const { project } = prepareProxyState({ workspace: process.env.GITHUB_WORKSPACE,
              envFile: process.env.PROXY_ENV_FILE, acmeFile: process.env.TRAEFIK_ACME_FILE });
            appendFileSync(process.env.GITHUB_OUTPUT, `project=${project}\n`);
            console.log('Persistent proxy state verified; ACME contents remain private.');
          } catch (error) {
            const known = ['persistent-proxy-env-required', 'acme-invalid', 'acme-incomplete',
              'proxy-project-unverified', 'state-not-a-regular-file', 'state-must-be-outside-checkout'];
            console.error('Proxy state preparation failed:', known.includes(error.message) ? error.message : 'private-state-unavailable');
            process.exitCode = 1;
          }
          NODE
      - name: Deploy the merged Traefik configuration
        env:
          PROXY_PROJECT: ${{ steps.state.outputs.project }}
        run: |
          mkdir -p "$PROXY_DEPLOY_DIR/dynamic"
          install -m 644 proxy-source/infra/proxy/traefik.yml "$PROXY_DEPLOY_DIR/traefik.yml"
          install -m 644 proxy-source/infra/proxy/docker-compose.yml "$PROXY_DEPLOY_DIR/docker-compose.yml"
          rsync -a --delete proxy-source/infra/proxy/dynamic/ "$PROXY_DEPLOY_DIR/dynamic/"
          cd "$PROXY_DEPLOY_DIR"
          docker compose --project-name "$PROXY_PROJECT" --env-file "$PROXY_ENV_FILE" config --quiet
          docker compose --project-name "$PROXY_PROJECT" --env-file "$PROXY_ENV_FILE" up -d --no-deps --force-recreate traefik
      - name: Verify public TLS renewal
        run: node proxy-source/scripts/check-tls.mjs

  changes:
    if: github.ref == 'refs/heads/main' && inputs.service != 'infra-proxy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.paths.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select services affected by the whole push
        id: paths
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_SERVICE: ${{ inputs.service }}
        run: node scripts/ci/deploy-paths.mjs

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      SERVICE: ${{ matrix.service }}
      ARGOS_REVISION: ${{ github.sha }}
      ARGOS_CHROMIUM_SECCOMP_PROFILE: /srv/apps/${{ matrix.service }}/chromium-seccomp.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        if: matrix.service == 'api-backend'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify shared Codex runtime access
        if: matrix.service == 'api-backend'
        run: docker pull ghcr.io/dokor/codex-runtime:0.156.1-r1
      - name: Sync service and compose sources
        run: |
          mkdir -p "/srv/apps/$SERVICE/src"
          rsync -a --delete "./apps/$SERVICE/" "/srv/apps/$SERVICE/src/"
          rsync -a "./infra/compose/$SERVICE/docker-compose.prod.yml" "/srv/apps/$SERVICE/docker-compose.prod.yml"
          chown -R "$USER:$USER" "/srv/apps/$SERVICE"
      - name: Sync security gateway sources
        if: matrix.service != 'console-web'
        run: |
          mkdir -p "/srv/apps/$SERVICE/egress"
          rsync -a --delete ./apps/audit-egress/ "/srv/apps/$SERVICE/egress/"
      - name: Sync Chromium sandbox profile and ensure shared network
        if: matrix.service == 'playwright-service' || matrix.service == 'lighthouse-service'
        run: |
          rsync -a "./infra/compose/$SERVICE/chromium-seccomp.json" "/srv/apps/$SERVICE/chromium-seccomp.json"
          docker network inspect argos_internal >/dev/null 2>&1 || docker network create argos_internal
      - name: Deploy (local build)
        run: |
          cd "/srv/apps/$SERVICE"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

  cleanup:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Cleanup old images once after all builds
        run: docker image prune -f

  post-deploy-audit:
    needs: [changes, deploy, cleanup]
    uses: ./.github/workflows/post-deploy-audit.yml
    permissions:
      contents: read
      issues: write
    with:
      services: ${{ needs.changes.outputs.services }}
    secrets:
      ARGOS_CI_EMAIL: ${{ secrets.ARGOS_CI_EMAIL }}
      ARGOS_CI_PASSWORD: ${{ secrets.ARGOS_CI_PASSWORD }}
