# Dedicated internal offer, assigned explicitly through account administration.
# Reference defaults also apply when production replaces application.conf via config.file.
# Keep normal offers and account authorization independent of this quota policy.
usage.offers.CI = {}

# Premium customer CI is independent of the internal CI offer and disabled until launch.
# Limits approved on 2026-10-18. Enforcement is completed by the keys/quotas lots.
# Do not enable before the epic launch checklist; see docs/ci/entitlements.md.
premium-ci {
  enabled = false
  monthly-analyses-per-key = 30
  max-active-keys = 3
  max-verified-targets = null
  max-concurrent-runs = 1
  max-key-lifetime-years = 1
  report-retention-days = 30
}

# Technical anti-abuse budgets, independent of the unlimited verified-domain entitlement.
account.rate.ci-target { account = 60, ip = 120 }
account.rate.ci-key { account = 60, ip = 120 }
// Commercial launch gates. No prices are invented or provisioned by application startup.
billing {
  reconciliation-batch-size = 20
  enabled = false
  payments-enabled = false
  live-mode = false
  launch-approved = false
  prices-approved = false
  tax-ready = false
  account-id = null
  product-id = null
  monthly-price-id = null
  annual-price-id = null
  monthly-amount-ht-cents = null
  annual-amount-ht-cents = null
  portal-config-id = null
  api-key = null
  webhook-secret = null
}
