# API documentation configuration
internal-api.auth-username = "internal-api"
internal-api.auth-password = ${?INTERNAL_API_PASSWORD}

# Candidate Raspberry profile (#232), to validate on the target hardware.
# Audit throughput is limited by the single-run scheduler, not HTTP workers.
http-grizzly.worker-threads-core-pool-size = 4
http-grizzly.worker-threads-pool-size = 24
http-grizzly.worker-threads-queue-limit = 64

# Database configuration

# for hikari config, quotes are required for sub-keys
# dialects values in: MYSQL, H2, ORACLE, POSTGRE, SQL_SERVEUR
db.dialect="MYSQL"
db.hikari.dataSourceClassName="org.mariadb.jdbc.MariaDbDataSource"

# database connection parameters, for datasource class, see https://github.com/brettwooldridge/HikariCP#popular-datasource-class-names
db.hikari."dataSource.url"="jdbc:mariadb://mariadb_host/database_name"
db.hikari."dataSource.user"=user
db.hikari."dataSource.password" = ${?DB_PASSWORD}
# connection pool configuration
db.hikari.maximumPoolSize=6
db.hikari.minimumIdle=1
# Milliseconds: bound the time an HTTP/scheduler thread waits for a connection.
db.hikari.connectionTimeout=5000
db.hikari.leakDetectionThreshold=30000


# Intervalle du scheduler de traitement des runs en file d'attente.
# fixedDelaySchedule + traitement synchrone : le tick suivant part APRÈS la fin
# du run précédent, donc une seule analyse à la fois quelle que soit sa durée.
# 5s = prise en charge rapide d'un run QUEUED (au lieu de ~1 min). Voir #167.
audit.scheduler.interval=5s

# Reprise des runs interrompus / bloqués (#127, #211).
# Un run resté en RUNNING plus longtemps que stuck-timeout (mesuré depuis started_at)
# est considéré comme abandonné : soit relancé (requeue) si attempt_count < max-attempts,
# soit marqué FAILED définitivement. stuck-timeout doit rester très supérieur à la durée
# de traitement normale (~20 s) pour ne jamais relancer un worker réellement actif.
audit.scheduler.stuck-timeout=20m
audit.scheduler.stuck-check-interval=1m
audit.scheduler.max-attempts=3

# SSL Labs assessments often need >=60s on a cache miss. Shared audit.timeout still caps this.
ssl-labs.timeout=90s

